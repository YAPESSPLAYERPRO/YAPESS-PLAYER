<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>YAPESS PLAYER Premium</title>
    <!-- CHARGEMENT DU LECTEUR HOLLYWOODIEN VIDEO.JS (STABLE ET UNIVERSEL) -->
    <link href="https://zencdn.net" rel="stylesheet" />
    <script src="https://zencdn.net"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #141414; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; display: flex; }
        
        /* PORTAIL DE CONNEXION */
        #login-screen { position: fixed; top:0; left:0; width:100vw; height:100vh; background:#181818; z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .login-box { background: #222; padding: 30px; border-radius: 8px; width: 400px; border-top: 4px solid #ff9900; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .login-box h3 { margin-bottom: 20px; text-align: center; color: #ff9900; text-transform: uppercase; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 12px; color: #aaa; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 12px; background: #111; border: 1px solid #333; color: white; border-radius: 4px; font-size: 14px; }
        .input-group input:focus { border-color: #ff9900; outline: none; }
        .btn-login { width: 100%; padding: 14px; background: #ff9900; border: none; color: black; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; text-transform: uppercase; }
        #login-status { margin-top: 15px; text-align: center; font-size: 13px; color: #ff9900; }
        
        /* INTERFACE PRINCIPALE TV */
        .sidebar { width: 25%; background-color: #0b0b0b; padding: 20px; border-right: 2px solid #222; height: 100%; overflow-y: auto; }
        .sidebar h2 { font-size: 18px; margin-bottom: 20px; color: #ff9900; text-transform: uppercase; }
        .category-item { padding: 12px; margin-bottom: 8px; background: #1c1c1c; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .category-item:hover, .category-item.active { background: #ff9900; color: black; font-weight: bold; }
        
        .channel-list { width: 30%; background-color: #111; padding: 20px; border-right: 2px solid #222; height: 100%; overflow-y: auto; }
        .channel-item { padding: 12px; margin-bottom: 8px; background: #1a1a1a; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .channel-item:hover { background: #2a2a2a; border-left: 4px solid #ff9900; }
        
        /* ZONE DU PLAYER */
        .main-player { width: 45%; height: 100%; background: black; position: relative; display: flex; align-items: center; justify-content: center; }
        .video-js { width: 100% !important; height: 100% !important; }
        .player-info { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.9)); padding: 30px 20px; pointer-events: none; z-index: 10; }
        .player-info h1 { font-size: 22px; color: #ff9900; }
    </style>
</head>
<body>

    <!-- PORTAIL DE CONNEXION -->
    <div id="login-screen">
        <div class="login-box">
            <h3>YAPESS PLAYER PRO</h3>
            <div class="input-group">
                <label>URL du serveur (HTTPS uniquement)</label>
                <input type="text" id="xp-url" placeholder="https://exemple.com:8080">
            </div>
            <div class="input-group">
                <label>Nom d'utilisateur (Username)</label>
                <input type="text" id="xp-user" placeholder="Identifiant">
            </div>
            <div class="input-group">
                <label>Mot de passe (Password)</label>
                <input type="password" id="xp-pass" placeholder="Mot de passe">
            </div>
            <button class="btn-login" onclick="connexionXtream()">Charger l'abonnement</button>
            <div id="login-status">Entrez vos codes revendeur.</div>
        </div>
    </div>

    <!-- INTERFACE TV -->
    <div class="sidebar">
        <h2>Catégories</h2>
        <div id="categories-container"></div>
    </div>

    <div class="channel-list">
        <h2>Chaînes</h2>
        <div id="channels-container"></div>
    </div>

    <!-- ZONE DU NOUVEAU PLAYER INTÉLLIGENT -->
    <div class="main-player">
        <video id="yapessPlayer" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" poster=""></video>
        <div class="player-info">
            <h1 id="current-channel-title">Sélectionnez une chaîne</h1>
        </div>
    </div>

    <script>
        let serverUrl = "";
        let username = "";
        let password = "";
        
        // Initialisation de Video.js avec gestion automatique du streaming de flux hls/m3u8
        const player = videojs('yapessPlayer', {
            fluid: false,
            autoplay: true,
            muted: true, // Obligatoire pour forcer le démarrage sur Chrome/Firefox
            controls: true,
            html5: {
                vhs: { overrideNative: true },
                nativeAudioTracks: false,
                nativeVideoTracks: false
            }
        });

        function connexionXtream() {
            serverUrl = document.getElementById('xp-url').value.trim();
            username = document.getElementById('xp-user').value.trim();
            password = document.getElementById('xp-pass').value.trim();

            if(!serverUrl || !username || !password) { alert("Remplissez les cases !"); return; }
            document.getElementById('login-status').innerText = "Connexion...";

            fetch(`${serverUrl}/player_api.php?username=${username}&password=${password}&action=get_live_categories`)
                .then(res => res.json())
                .then(categories => {
                    if (categories && categories.length > 0) {
                        afficherCategories(categories);
                        document.getElementById('login-screen').style.display = 'none';
                    } else {
                        document.getElementById('login-status').innerText = "Erreur de codes.";
                    }
                })
                .catch(err => { document.getElementById('login-status').innerText = "Erreur réseau HTTPS."; });
        }

        function afficherCategories(categories) {
            const container = document.getElementById('categories-container');
            container.innerHTML = "";
            categories.forEach(cat => {
                const div = document.createElement('div');
                div.className = "category-item";
                div.innerText = cat.category_name;
                div.onclick = () => {
                    document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    chargerChaines(cat.category_id);
                };
                container.appendChild(div);
            });
        }

        function chargerChaines(categoryId) {
            const container = document.getElementById('channels-container');
            container.innerHTML = "<p>Chargement...</p>";

            fetch(`${serverUrl}/player_api.php?username=${username}&password=${password}&action=get_live_streams&category_id=${categoryId}`)
                .then(res => res.json())
                .then(streams => {
                    container.innerHTML = "";
                    streams.forEach(stream => {
                        const div = document.createElement('div');
                        div.className = "channel-item";
                        div.innerText = stream.name;
                        div.onclick = () => {
                            // On repasse sur l'URL officielle Xtream Codes qui force le transcodage en flux direct
                            const streamUrl = `${serverUrl}/live/${username}/${password}/${stream.stream_id}.m3u8`;
                            lancerFluxPro(streamUrl, stream.name);
                        };
                        container.appendChild(div);
                    });
                });
        }

        function lancerFluxPro(url, nomChaine) {
            document.getElementById('current-channel-title').innerText = nomChaine;
            
            // Injection de la source avec le type MIME exact exigé par Video.js pour le streaming
            player.src({
                src: url,
                type: 'application/x-mpegURL'
            });

            player.ready(function() {
                player.play();
            });
        }
    </script>
</body>
</html>
