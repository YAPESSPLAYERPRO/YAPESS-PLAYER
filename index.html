<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Player IPTV Premium</title>
    <!-- Moteur vidéo Hls.js professionnel pour la lecture de flux en direct -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #141414; color: white; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; height: 100vh; display: flex; }
        
        /* 1. Colonne des Catégories (Gauche) */
        .sidebar { width: 20%; background-color: #0b0b0b; padding: 20px; border-right: 2px solid #222; height: 100%; overflow-y: auto; }
        .sidebar h2 { font-size: 18px; margin-bottom: 20px; color: #ff9900; text-transform: uppercase; letter-spacing: 1px; }
        .category-item { padding: 12px; margin-bottom: 8px; background: #1c1c1c; border-radius: 5px; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .category-item:hover, .category-item.active { background: #ff9900; color: black; font-weight: bold; }

        /* 2. Colonne des Chaînes (Milieu) */
        .channel-list { width: 30%; background-color: #111; padding: 20px; border-right: 2px solid #222; height: 100%; overflow-y: auto; }
        .channel-item { padding: 15px; margin-bottom: 8px; background: #1a1a1a; border-radius: 5px; cursor: pointer; display: flex; align-items: center; transition: 0.2s; }
        .channel-item:hover { background: #2a2a2a; border-left: 4px solid #ff9900; }
        .channel-item img { width: 40px; height: 40px; border-radius: 5px; margin-right: 15px; background: #333; object-fit: cover; }
        .channel-info strong { display: block; font-size: 15px; margin-bottom: 2px; }
        .channel-info p { font-size: 12px; color: #aaa; }

        /* 3. Zone du Lecteur Vidéo (Droite) */
        .main-player { width: 50%; height: 100%; background: black; display: flex; flex-direction: column; justify-content: center; position: relative; }
        video { width: 100%; height: 100%; object-fit: contain; background-color: #000; }
        
        /* Infos sur la chaîne en cours */
        .player-info { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.95)); padding: 40px 20px 20px 20px; pointer-events: none; opacity: 1; transition: opacity 0.5s; }
        .player-info h1 { font-size: 24px; color: #ff9900; margin-bottom: 5px; }
        .player-info p { font-size: 14px; color: #ccc; }
    </style>
</head>
<body>

    <!-- 1. Sidebar gauche : Catégories -->
    <div class="sidebar">
        <h2>Catégories</h2>
        <div class="category-item active">🇫🇷 France LIGHT</div>
        <div class="category-item">⚽ Sports Premium</div>
        <div class="category-item">🎬 Cinéma & Séries</div>
        <div class="category-item">🍿 VOD Nouveautés</div>
    </div>

    <!-- 2. Liste centrale : Chaînes de la catégorie -->
    <div class="channel-list">
        <!-- Chaîne 1 -->
        <div class="channel-item" onclick="changerChaine('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', 'TF1 HD', 'Le Journal de 20h - En Direct')">
            <img src="https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?w=80&auto=format&fit=crop" alt="Logo TF1">
            <div class="channel-info">
                <strong>TF1 HD</strong>
                <p>Le Journal de 20h</p>
            </div>
        </div>
        <!-- Chaîne 2 -->
        <div class="channel-item" onclick="changerChaine('https://samples.vodny.tv/live/playlist.m3u8', 'CANAL+ SPORT', 'Formule 1 : Grand Prix - En Direct')">
            <img src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=80&auto=format&fit=crop" alt="Logo C+">
            <div class="channel-info">
                <strong>CANAL+ SPORT HD</strong>
                <p>Direct : Match de Foot / F1</p>
            </div>
        </div>
    </div>

    <!-- 3. Écran de droite : Le Lecteur Vidéo Épuration Premium -->
    <div class="main-player">
        <video id="videoPlayer" autoplay controls></video>
        <div id="playerInfoOverlay" class="player-info">
            <h1 id="current-channel-title">Sélectionnez une chaîne</h1>
            <p id="current-channel-epg">Aucun programme sélectionné</p>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const infoOverlay = document.getElementById('playerInfoOverlay');
        let hls = null;
        let overlayTimeout = null;

        function changerChaine(url, nomChaine, programmeEpg) {
            document.getElementById('current-channel-title').innerText = nomChaine;
            document.getElementById('current-channel-epg').innerText = programmeEpg;

            // Afficher l'overlay d'information
            infoOverlay.style.opacity = '1';

            // Si un flux tournait déjà, on le détruit proprement pour éviter les fuites de mémoire
            if (hls) {
                hls.destroy();
            }

            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(function(error) {
                        console.log("Lecture automatique bloquée par le navigateur, attente action utilisateur.");
                    });
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Secours pour les navigateurs gérant nativement le format M3U8/HLS (Safari, Smart TVs spécifiques)
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }

            // Masquer automatiquement les informations de la chaîne après 4 secondes de lecture
            clearTimeout(overlayTimeout);
            overlayTimeout = setTimeout(() => {
                infoOverlay.style.opacity = '0';
            }, 4000);
        }

        // Réafficher les informations si l'utilisateur interagit avec le lecteur vidéo
        video.addEventListener('play', () => {
            infoOverlay.style.opacity = '1';
            clearTimeout(overlayTimeout);
            overlayTimeout = setTimeout(() => {
                infoOverlay.style.opacity = '0';
            }, 4000);
        });
    </script>
</body>
</html>
