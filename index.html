<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>YAPESS PLAYER Premium</title>
    <!-- Chargement de la version moderne et ultra-rapide de Firebase via CDN universel -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, doc, onSnapshot } from "https://gstatic.com";

        // TES Clés Firebase officielles (Remplacées et vérifiées pour ton projet)
        const firebaseConfig = {
            apiKey: "AIzaSyC79VkMKj7BEvODYnRl_9BEgxrrIobWMjY",
            authDomain: "://firebaseapp.com",
            projectId: "yapess-player-pro",
            storageBucket: "yapess-player-pro.firebasestorage.app",
            messagingSenderId: "1073719899008",
            appId: "1:1073719899008:web:50a65b212119a831330765",
            measurementId: "G-QKLBX5RHTN"
        };

        // 1. Génération ou récupération immédiate de l'ID unique YAPESS
        let myId = "";
        try {
            myId = localStorage.getItem('yapess_license_id');
        } catch(e) { console.log("LocalStorage bloqué"); }

        if (!myId) {
            myId = 'YAPESS-' + Math.random().toString(36).substr(2, 9).toUpperCase();
            try {
                localStorage.setItem('yapess_license_id', myId);
            } catch(e) {}
        }

        // On affiche l'identifiant TOUT DE SUITE à l'écran sans attendre le réseau
        document.getElementById('display-id').innerText = myId;
        document.getElementById('status-text').innerText = "Vérification de la licence...";

        // 2. Connexion à ta base de données Firebase
        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);

            // Écoute en temps réel des changements sur le document du client
            onSnapshot(doc(db, "devices", myId), (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    if (data.is_active === true) {
                        document.getElementById('status-text').innerText = "✅ Licence Active ! Redirection en cours...";
                        document.getElementById('status-text').style.color = "#00ff00";
                        setTimeout(() => {
                            window.location.href = data.playlist_url;
                        }, 1500);
                    } else {
                        document.getElementById('status-text').innerText = "❌ Licence expirée ou désactivée.";
                        document.getElementById('status-text').style.color = "#ff3333";
                    }
                } else {
                    document.getElementById('status-text').innerText = "⏳ En attente d'activation par le revendeur.";
                    document.getElementById('status-text').style.color = "#ff9900";
                }
            }, (error) => {
                console.error("Erreur Firestore:", error);
                document.getElementById('status-text').innerText = "⏳ Mode autonome (En attente d'activation).";
            });
        } catch(e) {
            console.error("Erreur Firebase:", e);
            document.getElementById('status-text').innerText = "⚠️ Erreur d'initialisation du portail.";
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #141414; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .activation-box { border: 2px solid #ff9900; padding: 40px; border-radius: 10px; background: #1a1a1a; max-width: 500px; width: 90%; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .device-id { font-size: 32px; font-weight: bold; color: #ff9900; letter-spacing: 2px; margin: 25px 0; background: #000; padding: 15px; border-radius: 5px; border: 1px solid #333; }
        h2 { text-transform: uppercase; letter-spacing: 1px; }
        p { color: #aaa; margin: 5px 0; }
        .status { font-size: 16px; color: #ff9900; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="activation-box">
        <h2>YAPESS PLAYER Premium</h2>
        <p style="margin-top: 15px;">Pour activer votre abonnement sur cette télévision,</p>
        <p>veuillez transmettre cet identifiant à votre revendeur :</p>
        
        <!-- Zone d'affichage immédiat -->
        <div id="display-id" class="device-id">GÉNÉRATION...</div>
        
        <p id="status-text" class="status">Initialisation du système...</p>
    </div>

</body>
</html>
