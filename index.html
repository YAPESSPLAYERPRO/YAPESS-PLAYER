<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>YAPESS PLAYER Premium</title>
    <!-- Moteur vidéo professionnel Hls.js -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #141414; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; display: flex; }
        
        /* ÉCRAN D'ACTIVATION */
        #activation-screen { position: fixed; top:0; left:0; width:100vw; height:100vh; background:#111; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .activation-box { border: 2px solid #ff9900; padding: 40px; border-radius: 10px; background: #1a1a1a; max-width: 500px; }
        .device-id { font-size: 32px; font-weight: bold; color: #ff9900; letter-spacing: 2px; margin: 20px 0; background: #000; padding: 10px; border-radius: 5px; }
        
        /* INTERFACE PRINCIPALE TV */
        .sidebar { width: 20%; background-color: #0b0b0b; padding: 20px; border-right: 2px solid #222; height: 100%; }
        .sidebar h2 { font-size: 18px; margin-bottom: 20px; color: #ff9900; text-transform: uppercase; }
        .category-item { padding: 12px; margin-bottom: 8px; background: #1c1c1c; border-radius: 5px; cursor: pointer; }
        .category-item.active { background: #ff9900; color: black; font-weight: bold; }
        
        .channel-list { width: 30%; background-color: #111; padding: 20px; border-right: 2px solid #222; height: 100%; overflow-y: auto; }
        .channel-item { padding: 15px; margin-bottom: 8px; background: #1a1a1a; border-radius: 5px; cursor: pointer; display: flex; align-items: center; }
        .channel-item:hover { background: #2a2a2a; border-left: 4px solid #ff9900; }
        .channel-item img { width: 40px; height: 40px; border-radius: 5px; margin-right: 15px; }
        
        .main-player { width: 50%; height: 100%; background: black; position: relative; }
        video { width: 100%; height: 100%; object-fit: contain; }
        .player-info { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.9)); padding: 30px 20px; }
        .player-info h1 { font-size: 24px; color: #ff9900; }
    </style>
</head>
<body>

    <!-- ÉCRAN D'ACTIVATION (Disparaît après 5 secondes pour le test) -->
    <div id="activation-screen">
        <div class="activation-box">
            <h2 style="color: #ff9900;">YAPESS PLAYER Premium</h2>
            <p style="margin-top: 10px; color: #aaa;">Application en mode démonstration autonome.</p>
            <p style="margin-top: 20px;">Identifiant de votre appareil :</p>
            <div id="display-id" class="device-id">GÉNÉRATION...</div>
            <p style="font-size: 14px; color: #ff9900;">Déblocage de l'interface dans 5 secondes...</p>
        </div>
    </div>

    <!-- 1. COLONNE DES CATÉGORIES -->
    <div class="sidebar">
        <h2>Catégories</h2>
        <div class="category-item active">📺 Chaînes de Test</div>
    </div>

    <!-- 2. COLONNE DES CHAÎNES -->
    <div class="channel-list">
        <!-- Flux Live Sécurisé Wowza de Test -->
        <div class="channel-item" onclick="changerChaine('https://wowza.com', 'INFO TV LIVE HD')">
            <img src="https://placeholder.com" alt="Logo">
            <div>
                <strong>INFO TV LIVE HD</strong>
                <p style="font-size: 12px; color: #aaa;">Cliquez pour lancer le direct</p>
            </div>
        </div>
    </div>

    <!-- 3. ZONE DU LECTEUR VIDÉO -->
    <div class="main-player">
        <video id="videoPlayer" autoplay controls muted></video>
        <div class="player-info">
            <h1 id="current-channel-title">Sélectionnez une chaîne</h1>
        </div>
    </div>

    <script>
        // Génération de l'identifiant unique YAPESS
        let myId = 'YAPESS-' + Math.random().toString(36).substr(2, 9).toUpperCase();
        document.getElementById('display-id').innerText = myId;

        // Minuteur de 5 secondes pour masquer l'écran de blocage
        setTimeout(() => {
            document.getElementById('activation-screen').style.display = 'none';
        }, 5000);

        // Code du décodeur vidéo
        const video = document.getElementById('videoPlayer');
        let hls = null;

        function changerChaine(url, nomChaine) {
            document.getElementById('current-channel-title').innerText = nomChaine;
            
            // On nettoie le lecteur s'il y avait déjà une vidéo en cours
            if (hls) {
                hls.destroy();
            }
            
            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() { 
                    video.play().catch(e => console.log("Lecture automatique bloquée, cliquez sur Play")); 
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Pour la compatibilité avec certains navigateurs TV natifs
                video.src = url;
                video.addEventListener('loadedmetadata', function() { 
                    video.play(); 
                });
            }
        }
    </script>
</body>
</html>
