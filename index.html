<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>YAPESS PLAYER Premium</title>
    <!-- Moteur vidéo professionnel Hls.js pour lire tes vrais flux IPTV -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #141414; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; display: flex; }
        
        /* ÉCRAN DE CONNEXION DIRECT */
        #login-screen { position: fixed; top:0; left:0; width:100vw; height:100vh; background:#181818; z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .login-box { background: #222; padding: 30px; border-radius: 8px; width: 400px; border-top: 4px solid #ff9900; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .login-box h3 { margin-bottom: 20px; text-align: center; color: #ff9900; text-transform: uppercase; letter-spacing: 1px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 12px; color: #aaa; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 12px; background: #111; border: 1px solid #333; color: white; border-radius: 4px; font-size: 14px; }
        .input-group input:focus { border-color: #ff9900; outline: none; }
        .btn-login { width: 100%; padding: 14px; background: #ff9900; border: none; color: black; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; text-transform: uppercase; }
        .btn-login:hover { background: #e0a800; }
        #login-status { margin-top: 15px; text-align: center; font-size: 13px; color: #ff9900; }

        /* INTERFACE PRINCIPALE TV */
        .sidebar { width: 25%; background-color: #0b0b0b; padding: 20px; border-right: 2px solid #222; height: 100%; overflow-y: auto; }
        .sidebar h2 { font-size: 18px; margin-bottom: 20px; color: #ff9900; text-transform: uppercase; }
        .category-item { padding: 12px; margin-bottom: 8px; background: #1c1c1c; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .category-item:hover, .category-item.active { background: #ff9900; color: black; font-weight: bold; }
        
        .channel-list { width: 30%; background-color: #111; padding: 20px; border-right: 2px solid #222; height: 100%; overflow-y: auto; }
        .channel-item { padding: 12px; margin-bottom: 8px; background: #1a1a1a; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .channel-item:hover { background: #2a2a2a; border-left: 4px solid #ff9900; }
        
        .main-player { width: 45%; height: 100%; background: black; position: relative; }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; }
        .player-info { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.9)); padding: 30px 20px; pointer-events: none; }
        .player-info h1 { font-size: 22px; color: #ff9900; }
    </style>
</head>
<body>

    <!-- PORTAIL DE CONNEXION -->
    <div id="login-screen">
        <div class="login-box">
            <h3>YAPESS PLAYER PRO</h3>
            <div class="input-group">
                <label>URL du serveur (HTTPS uniquement)</label>
                <input type="text" id="xp-url" placeholder="https://exemple.com:8080">
            </div>
            <div class="input-group">
                <label>Nom d'utilisateur (Username)</label>
                <input type="text" id="xp-user" placeholder="Identifiant">
            </div>
            <div class="input-group">
                <label>Mot de passe (Password)</label>
                <input type="password" id="xp-pass" placeholder="Mot de passe">
            </div>
            <button class="btn-login" onclick="connexionXtream()">Charger l'abonnement</button>
            <div id="login-status">Entrez vos codes revendeur pour tester.</div>
        </div>
    </div>

    <!-- INTERFACE DE L'APPLICATION -->
    <div class="sidebar">
        <h2>Catégories</h2>
        <div id="categories-container">
            <p style="color:#666; font-size:13px;">Aucune catégorie chargée.</p>
        </div>
    </div>

    <div class="channel-list">
        <h2>Chaînes</h2>
        <div id="channels-container">
            <p style="color:#666; font-size:13px;">Sélectionnez une catégorie.</p>
        </div>
    </div>

    <div class="main-player">
        <!-- Ajout des attributs muted et controls pour éviter les blocages de sécurité des navigateurs -->
        <video id="videoPlayer" controls autoplay muted playsinline></video>
        <div class="player-info">
            <h1 id="current-channel-title">Sélectionnez une chaîne</h1>
        </div>
    </div>

    <script>
        let serverUrl = "";
        let username = "";
        let password = "";
        const video = document.getElementById('videoPlayer');
        let hls = null;

        function connexionXtream() {
            serverUrl = document.getElementById('xp-url').value.trim();
            username = document.getElementById('xp-user').value.trim();
            password = document.getElementById('xp-pass').value.trim();

            if(!serverUrl || !username || !password) {
                alert("Veuillez remplir toutes les cases !");
                return;
            }

            document.getElementById('login-status').innerText = "Connexion au serveur en cours...";

            const apiCategories = `${serverUrl}/player_api.php?username=${username}&password=${password}&action=get_live_categories`;

            fetch(apiCategories)
                .then(response => response.json())
                .then(categories => {
                    if (categories && categories.length > 0) {
                        document.getElementById('login-status').innerText = "Catégories chargées !";
                        afficherCategories(categories);
                        document.getElementById('login-screen').style.display = 'none';
                    } else {
                        document.getElementById('login-status').innerText = "Erreur : Serveur vide ou codes incorrects.";
                    }
                })
                .catch(error => {
                    console.error("Erreur API:", error);
                    document.getElementById('login-status').innerText = "Erreur. Vérifiez l'URL ou l'accès HTTPS.";
                });
        }

        function afficherCategories(categories) {
            const container = document.getElementById('categories-container');
            container.innerHTML = "";

            categories.forEach(cat => {
                const div = document.createElement('div');
                div.className = "category-item";
                div.innerText = cat.category_name;
                div.onclick = () => {
                    document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    chargerChainesDeLaCategorie(cat.category_id);
                };
                container.appendChild(div);
            });
        }

        function chargerChainesDeLaCategorie(categoryId) {
            const container = document.getElementById('channels-container');
            container.innerHTML = "<p style='color:#aaa;'>Chargement des chaînes...</p>";

            const apiStreams = `${serverUrl}/player_api.php?username=${username}&password=${password}&action=get_live_streams&category_id=${categoryId}`;

            fetch(apiStreams)
                .then(response => response.json())
                .then(streams => {
                    container.innerHTML = "";
                    if(streams.length === 0) {
                        container.innerHTML = "<p style='color:#666;'>Aucune chaîne disponible.</p>";
                        return;
                    }

                    streams.forEach(stream => {
                        const div = document.createElement('div');
                        div.className = "channel-item";
                        div.innerText = stream.name;
                        div.onclick = () => {
                            // CORRECTION ESSENTIELLE : Utilisation du format direct universel Xtream (.ts au lieu de .m3u8)
                            const streamUrl = `${serverUrl}/live/${username}/${password}/${stream.stream_id}.ts`;
                            lancerFluxIPTV(streamUrl, stream.name);
                        };
                        container.appendChild(div);
                    });
                })
                .catch(err => {
                    container.innerHTML = "<p style='color:red;'>Erreur de chargement des flux.</p>";
                });
        }

        function lancerFluxIPTV(url, nomChaine) {
            document.getElementById('current-channel-title').innerText = nomChaine;
            
            // Le format .ts est lu nativement par l'élément vidéo sans avoir besoin du décodeur Hls.js
            if (hls) {
                hls.destroy();
                hls = null;
            }

            video.src = url;
            video.load();
            
            var playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.log("Lecture automatique bloquée. Cliquez manuellement sur PLAY.");
                });
            }
        }
    </script>
</body>
</html>
